name: Build OpenTaiko Android APK

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - master
    paths:
      - 'OpenTaiko.Android/**'
      - 'OpenTaiko/**'
      - 'third_party/**'
      - '*.props'
      - '*.targets'
      - '*.sln'
      - '*.csproj'
      - 'build.sh'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install             "platform-tools"             "build-tools;35.0.0"

      - name: Install .NET Android workload
        shell: bash
        run: |
          dotnet workload install android
          dotnet workload list

      - name: Make build script executable
        shell: bash
        run: chmod +x ./build.sh

      - name: Show build environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          dotnet --info
          java -version
          adb version
          ./build.sh --help

      - name: Build Android APK
        shell: bash
        env:
          CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            ./build.sh --clean
          else
            ./build.sh --clean --release
          fi

      - name: Find APKs
        shell: bash
        run: |
          echo "Generated APKs:"
          find OpenTaiko.Android/bin -type f -name '*.apk' -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTaiko-Android-${{ github.event.inputs.configuration || 'Release' }}
          path: |
            OpenTaiko.Android/bin/**/*.apk
          if-no-files-found: error
          retention-days: 30
