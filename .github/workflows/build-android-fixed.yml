name: Build OpenTaiko Android APK

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - main
      - master
    paths:
      - 'OpenTaiko.Android/**'
      - 'OpenTaiko/**'
      - 'third_party/**'
      - '*.props'
      - '*.targets'
      - '*.sln'
      - '*.csproj'
      - 'OpenTaiko.Android/scripts/**'
      - '.github/workflows/build-android-fixed.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK manually
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euxo pipefail

          mkdir -p "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            cd /tmp
            rm -rf cmdline-tools commandlinetools-linux-9477386_latest.zip
            curl -fLo commandlinetools-linux-9477386_latest.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
            unzip -q commandlinetools-linux-9477386_latest.zip
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            cd -
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0"

      - name: Install .NET Android workload
        shell: bash
        run: |
          dotnet workload install android --ignore-failed-sources
          dotnet workload list

      - name: Make build script executable
        shell: bash
        run: chmod +x ./OpenTaiko.Android/scripts/build.sh

      - name: Show build environment
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          dotnet --info
          java -version
          adb version
          ./OpenTaiko.Android/scripts/build.sh --help

      - name: Build Android APK
        shell: bash
        env:
          CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if [ "$CONFIGURATION" = "Debug" ]; then
            ./OpenTaiko.Android/scripts/build.sh --clean
          else
            ./OpenTaiko.Android/scripts/build.sh --clean --release
          fi

      - name: Find APKs
        shell: bash
        run: |
          echo "Generated APKs:"
          find OpenTaiko.Android/bin -type f -name '*.apk' -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTaiko-Android-${{ github.event.inputs.configuration || 'Release' }}
          path: |
            OpenTaiko.Android/bin/**/*.apk
          if-no-files-found: error
          retention-days: 30
